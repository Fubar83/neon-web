<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #cfe; }
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #frame { position: relative; }
      canvas { display: block; }
      .hud { position: absolute; pointer-events: none; font-size: 14px; letter-spacing: 0.06em; text-shadow: 0 0 6px rgba(0,255,255,0.5); }
      #score { left: 16px; top: 8px; font-size: 22px; font-weight: 600; color: #fff; }
      #lives { left: 16px; top: 40px; color: #7ff; }
      #coins { left: 16px; top: 62px; color: #ffd860; font-size: 13px; text-shadow: 0 0 6px rgba(255,200,60,0.6); }
      #hull { right: 16px; top: 12px; width: 200px; }
      #hullbar { height: 8px; background: #123; margin-top: 4px; }
      #hullfill { height: 100%; width: 100%; background: #5df; box-shadow: 0 0 8px #5df; }
      #weapons { right: 16px; top: 44px; text-align: right; font-size: 12px; color: #fd7; }
      #cdbar { right: 16px; top: 62px; width: 200px; height: 4px; background: #321; }
      #cdfill { height: 100%; width: 100%; background: #ffd860; }
      #upgrades { right: 16px; top: 70px; text-align: right; font-size: 11px; color: #ca8; }
      #level { left: 16px; bottom: 12px; font-size: 12px; color: #9fb; }
      #dist { left: 50%; transform: translateX(-50%); top: 10px; width: 46%; text-align: center; font-size: 13px; color: #bfe; }
      #distbar { position: relative; height: 6px; background: #123; margin-top: 4px; }
      #distfill { height: 100%; width: 0; background: linear-gradient(90deg, #3cf, #f4c); box-shadow: 0 0 8px #3cf; }
      #distbest { position: absolute; top: -3px; width: 2px; height: 12px; background: #ffd860; box-shadow: 0 0 6px #ffd860; }
      #bossbar { left: 50%; transform: translateX(-50%); top: 52px; width: 40%; text-align: center; font-size: 13px; color: #f8a; }
      #bossbg { height: 8px; background: #312; margin-top: 3px; }
      #bossfill { height: 100%; width: 100%; background: #f46; box-shadow: 0 0 8px #f46; }
      #msg { left: 0; right: 0; top: 30%; text-align: center; font-size: 28px; font-weight: 600; color: #ffd860; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 14px rgba(255,200,60,0.7); }
      #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
      #menu h1 { font-size: 64px; letter-spacing: 0.5em; margin: 0 0 6px 0.5em; color: #ff4fd0; text-shadow: 0 0 20px #f0c; font-weight: 300; }
      #menu .sub { color: #5ef; letter-spacing: 0.2em; margin-bottom: 18px; }
      #list { min-width: 420px; background: rgba(5,5,15,0.85); border-top: 2px solid #3aa; border-bottom: 2px solid #3aa; padding: 8px 0; }
      .item { padding: 6px 24px; color: #9ab; cursor: pointer; letter-spacing: 0.08em; }
      .item.sel { background: rgba(30,150,200,0.35); color: #fff; box-shadow: inset 4px 0 #5ef; }
      .group { padding: 8px 18px 2px; color: #f6c; font-size: 12px; letter-spacing: 0.15em; }
      #skill { margin-top: 14px; font-size: 22px; color: #ffd860; }
      #skilldesc { color: #8ab; font-size: 13px; margin-top: 4px; }
      #hangar { overflow-anchor: none; position: absolute; z-index: 5; right: 0; top: 0; bottom: 0; width: 38%; box-sizing: border-box; padding: 18px 22px; background: rgba(4,6,16,0.97); border-left: 2px solid #3aa; font-size: 13px; color: #bcd; overflow-y: auto; }
      .hrow { margin: 12px 0 4px; }
      .htitle { color: #7ab; font-size: 11px; letter-spacing: 0.12em; margin-bottom: 5px; }
      .hchip { display: inline-block; padding: 3px 9px; margin: 0 5px 5px 0; border: 1px solid #2a3a4a; border-radius: 3px; font-size: 12px; cursor: pointer; color: #9ab; letter-spacing: 0.05em; }
      .hchip.sel { color: #fff; border-color: #5ef; box-shadow: 0 0 10px rgba(80,230,255,0.5) inset; }
      .hchip.off { opacity: 0.38; }
      .hchip.cur { outline: 2px solid #ffd860; outline-offset: 1px; }
      .hchip small { color: #c97; font-size: 10px; }
      .hsw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      .hhead { position: sticky; top: -18px; margin: -18px -22px 6px; padding: 18px 22px 8px; background: rgba(4,6,16,1); z-index: 2; border-bottom: 1px solid #1a2a3a; }
      .hdesc { margin-top: 8px; color: #dde; min-height: 2.9em; line-height: 1.45; font-size: 12px; }
      #hangar .ghelp { position: static; margin-top: 14px; }
      .hnote { margin-top: 8px; color: #789; font-size: 11px; font-style: italic; }
      #gallery { position: absolute; right: 0; top: 0; bottom: 0; width: 31%; box-sizing: border-box; padding: 18px 22px; background: rgba(4,6,16,0.84); border-left: 2px solid #3aa; font-size: 13px; color: #bcd; overflow-y: auto; }
      .gtitle { color: #f6c; letter-spacing: 0.3em; font-size: 13px; }
      #gcount { float: right; color: #789; letter-spacing: 0.05em; }
      #gtabs { margin: 10px 0 14px; line-height: 1.9; }
      .gtab { display: inline-block; padding: 0 7px; margin: 0 4px 3px 0; border: 1px solid #234; border-radius: 3px; font-size: 11px; cursor: pointer; opacity: 0.6; }
      .gtab.sel { opacity: 1; border-color: currentColor; box-shadow: 0 0 8px currentColor inset; }
      #gname { font-size: 26px; font-weight: 600; letter-spacing: 0.08em; margin-bottom: 10px; }
      #gstats div { padding: 3px 0; border-bottom: 1px solid #1a2a3a; color: #eef; }
      #gstats span { display: inline-block; width: 92px; color: #7ab; }
      #gabil { padding-left: 18px; margin: 14px 0; line-height: 1.5; }
      #gabil li { margin-bottom: 5px; }
      #gnote { color: #8a9; font-size: 12px; font-style: italic; }
      .ghelp { position: absolute; bottom: 14px; left: 22px; right: 22px; color: #678; font-size: 11px; }
      #help { margin-top: 18px; color: #789; font-size: 12px; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="frame">
      <div id="score" class="hud">SCORE 0000000</div>
      <div id="lives" class="hud"></div>
      <div id="coins" class="hud"></div>
      <div id="hull" class="hud">HULL<div id="hullbar"><div id="hullfill"></div></div></div>
      <div id="weapons" class="hud"></div>
      <div id="cdbar" class="hud"><div id="cdfill"></div></div>
      <div id="upgrades" class="hud"></div>
      <div id="level" class="hud"></div>
      <div id="dist" class="hud"><div id="disttext"></div><div id="distbar"><div id="distfill"></div><div id="distbest"></div></div></div>
      <div id="bossbar" class="hud" style="visibility:hidden"><div id="bossname"></div><div id="bossbg"><div id="bossfill"></div></div></div>
      <div id="msg" class="hud"></div>
      <div id="flash" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;"></div>
      <div id="gallery" style="display:none">
        <div class="gtitle">GALLERY <span id="gcount"></span></div>
        <div id="gtabs"></div>
        <div id="gname"></div>
        <div id="gstats"></div>
        <ul id="gabil"></ul>
        <div id="gnote"></div>
        <div class="ghelp">LEFT / RIGHT browse &nbsp; H hit circles &nbsp; ESC back</div>
      </div>
      <div id="hangar" style="display:none"></div>
      <div id="menu">
        <h1>NEON</h1>
        <div class="sub">SELECT A LEVEL</div>
        <div id="list"></div>
        <div id="skill"></div>
        <div id="skilldesc"></div>
        <div id="help">UP / DOWN choose &nbsp; LEFT / RIGHT difficulty &nbsp; ENTER start &nbsp;&nbsp; in game: WASD / arrows move (fires by itself at enemies), SPACE secondary, SHIFT precise, P pause &amp; shop, M music, ESC menu</div>
      </div>
    </div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
